name: Android SDK CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Binary Compatibility (BCV)
        run: ./gradlew apiCheck

      - name: Run Quality Verification & Unit Tests
        run: ./gradlew check testDebugUnitTest

      - name: Build SDK Libraries & Sample App
        run: ./gradlew :sdk-core:assembleRelease :sdk-ui:assembleRelease :sample:assembleDebug
