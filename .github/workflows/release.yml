name: Release Distribution

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Distribution Packages
        run: |
          ./gradlew :quality-verifier:publishToMavenLocal
          ./gradlew :kickoff-cli:distZip :kickoff-cli:distTar

      - name: Publish Quality Verifier to Maven Central
        if: env.SONATYPE_USERNAME != ''
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew publishAggregationToCentralPortal

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kickoff-cli/build/distributions/*.zip
            kickoff-cli/build/distributions/*.tar
          generate_release_notes: true
